name = "test2"
main = "index.js"
compatibility_date = "2025-09-01"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[build]
command = "wasm-pack build --target web"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
