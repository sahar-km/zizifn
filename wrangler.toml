"$schema" = "./node_modules/wrangler/config-schema.json"
name = "sahar"
main = "index.js"
compatibility_date = "2026-10-02"

[build]
command = "wasm-pack build --target web"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[rules]]
type = "Text"
globs = ["**/*.b64"]
fallthrough = true
