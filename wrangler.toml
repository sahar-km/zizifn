name = "0x00"
main = "index.js"
compatibility_date = "2025-09-01"

[build]
command = "wasm-pack build --target web"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[rules]]
type = "Text"
globs = ["**/*.b64"]
fallthrough = true

#[observability]
#enabled = true
#head_sampling_rate = 1
#redact_query_string = false

#[observability.logs]
#enabled = true
#head_sampling_rate = 1
##invocation_logs = true
#persist = true

#[observability.traces]
#enabled = true
#head_sampling_rate = 1
#persist = true

#[observability.issue_detection]
#enabled = true
